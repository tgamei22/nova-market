<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Market - Loja Online</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <div class="logo" onclick="goHome()" style="cursor: pointer;">
            <h1><i class="fa-solid fa-store"></i> Nova Market</h1>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar produtos...">
            <button><i class="fa-solid fa-search"></i></button>
        </div>
        <div class="cart-icon" id="cartBtn">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount">0</span>
        </div>
    </header>

    <!-- Conteúdo Principal (Altera dinamicamente entre Catálogo e Página de Produto) -->
    <main class="main-container" id="mainContainer">
        <!-- O conteúdo será injetado via JavaScript -->
    </main>

    <!-- Modal do Carrinho de Compras -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <span class="close-btn" id="closeCart">&times;</span>
            <h2>O seu Carrinho</h2>
            <div id="cartItems" class="cart-items"></div>
            <div class="cart-total">
                <p>Total: <span id="cartTotalPrice">0.00 €</span></p>
                <button class="checkout-btn" id="checkoutBtn">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Nova Market. Todos os direitos reservados.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
