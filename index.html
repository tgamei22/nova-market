<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Market - A sua loja online</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <div class="logo">
            <h1><i class="fa-solid fa-store"></i> Nova Market</h1>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Pesquisar produtos...">
            <button><i class="fa-solid fa-search"></i></button>
        </div>
        <div class="cart-icon" id="cartBtn">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount">0</span>
        </div>
    </header>

    <!-- Secção de Destaque / Hero -->
    <section class="hero">
        <h2>Bem-vindo à Nova Market</h2>
        <p>Os melhores gadgets e tendências de mercado com entrega rápida.</p>
    </section>

    <!-- Categorias -->
    <div class="categories">
        <button class="cat-btn active" data-category="all">Todos</button>
        <button class="cat-btn" data-category="tecnologia">Tecnologia</button>
        <button class="cat-btn" data-category="casa">Casa & Cobre</button>
        <button class="cat-btn" data-category="acessorios">Acessórios</button>
        <button class="cat-btn" data-category="bem-estar">Bem-Estar</button>
    </div>

    <!-- Lista de Produtos -->
    <main class="container">
        <div class="products-grid" id="productsGrid">
            <!-- Os produtos serão injetados aqui via JavaScript -->
        </div>
    </main>

    <!-- Modal de Detalhes do Produto -->
    <div class="product-modal" id="productModal">
        <div class="product-modal-content">
            <span class="close-btn" id="closeProductModal">&times;</span>
            <div class="modal-grid">
                <img id="modalProductImg" src="" alt="Produto">
                <div class="modal-info">
                    <h2 id="modalProductName"></h2>
                    <p id="modalProductPrice" class="modal-price"></p>
                    <p id="modalProductDesc" class="modal-desc"></p>
                    <button class="add-to-cart" id="modalAddToCartBtn">Adicionar ao Carrinho</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal do Carrinho de Compras -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <span class="close-btn" id="closeCart">&times;</span>
            <h2>O seu Carrinho</h2>
            <div id="cartItems" class="cart-items"></div>
            <div class="cart-total">
                <p>Total: <span id="cartTotalPrice">0.00 €</span></p>
                <button class="checkout-btn" id="checkoutBtn">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 Nova Market. Todos os direitos reservados.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
